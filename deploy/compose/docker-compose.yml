# Relay in production on one machine: Caddy (TLS) in front of Relay, with Postgres and Valkey.
#   cp .env.example .env   # then fill in every value marked "change me"
#   docker compose up -d
# With voice and video (LiveKit, see .env.example):
#   docker compose --profile calls up -d
# Any other Relay setting (for example S3 storage) goes in relay.env next to this file.
name: relay

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?set RELAY_DOMAIN in .env}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN:-}
      # Caddy gets and renews a certificate for the domain by itself (Let's Encrypt or ZeroSSL);
      # for "localhost" it uses its own local certificate authority. The config lives here so the
      # stack needs no files besides this one and .env.
      CADDYFILE: |
        {$$RELAY_DOMAIN} {
          encode zstd gzip
          reverse_proxy relay:3000
          header {
            Strict-Transport-Security "max-age=31536000"
            -Server
          }
        }
    command:
      - sh
      - -c
      - |
        printf '%s' "$$CADDYFILE" > /config/Caddyfile
        # With calls on, LiveKit's signalling gets a name and a certificate of its own.
        if [ -n "$$LIVEKIT_DOMAIN" ]; then
          printf '\n%s {\n  reverse_proxy livekit:7880\n}\n' "$$LIVEKIT_DOMAIN" >> /config/Caddyfile
        fi
        exec caddy run --adapter caddyfile --config /config/Caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      relay:
        condition: service_healthy

  relay:
    image: ${RELAY_IMAGE:-ghcr.io/velarixx/relay:0.2.0}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # Every other Relay setting (see "Settings from the environment" in the guides), one per line.
    env_file:
      - path: ./relay.env
        required: false
    environment:
      NODE_ENV: production
      PUBLIC_URL: https://${RELAY_DOMAIN}
      DATABASE_URL: postgres://relay:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/relay
      VALKEY_URL: redis://valkey:6379
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_URL: ${LIVEKIT_API_URL:-}
      LICENSE_SERVER_URL: ${LICENSE_SERVER_URL:-}
      PUSH_GATEWAY_URL: ${PUSH_GATEWAY_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - relay-files:/data
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: relay
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'relay']
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ['valkey-server', '--appendonly', 'yes']
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # Voice and video, with `--profile calls`. Browsers reach it at LIVEKIT_DOMAIN through Caddy
  # for signalling, and directly on ports 7881 (TCP) and 7882 (UDP) for sound and picture.
  livekit:
    image: livekit/livekit-server:v1.9.1
    profiles: [calls]
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: ${LIVEKIT_TCP_PORT:-7881}
          udp_port: ${LIVEKIT_UDP_PORT:-7882}
          use_external_ip: true
        keys:
          ${LIVEKIT_API_KEY:-relay}: ${LIVEKIT_API_SECRET:-}
        logging:
          level: info
    ports:
      - '${LIVEKIT_TCP_PORT:-7881}:${LIVEKIT_TCP_PORT:-7881}'
      - '${LIVEKIT_UDP_PORT:-7882}:${LIVEKIT_UDP_PORT:-7882}/udp'

  # Tools that run only when asked for (see "Backups" in the guides):
  #   docker compose run --rm backup             writes a new folder under ./backups
  #   docker compose run --rm restore <folder>   puts that backup back
  backup:
    image: postgres:18-alpine
    profiles: [tools]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - relay-files:/relay:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - sh
      - -euc
      - |
        name=$$(date -u +%Y-%m-%dT%H%M%SZ)
        out=/backups/$$name
        mkdir -p "$$out/files"
        pg_dump --host=postgres --username=relay --format=custom --no-owner --no-privileges \
          --file="$$out/database.dump" relay
        if [ -d /relay/files ]; then cp -R /relay/files/. "$$out/files/"; fi
        count=$$(find "$$out/files" -type f | wc -l)
        printf '{\n  "format": 1,\n  "createdAt": "%s",\n  "files": %s\n}\n' \
          "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$$count" > "$$out/manifest.json"
        echo "backup written to backups/$$name (database and $$count files)"

  restore:
    image: postgres:18-alpine
    profiles: [tools]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - relay-files:/relay
      - ${BACKUP_DIR:-./backups}:/backups:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - sh
      - -euc
      - |
        name=$${1:?give the name of a folder under backups}
        from=/backups/$$name
        if [ ! -f "$$from/manifest.json" ]; then echo "no backup at backups/$$name"; exit 1; fi
        # Into an empty database: nothing a later version added survives, so going back to the
        # version that made the backup works.
        psql --host=postgres --username=relay --dbname=postgres -v ON_ERROR_STOP=1 --quiet \
          -c 'DROP DATABASE IF EXISTS relay WITH (FORCE)' -c 'CREATE DATABASE relay OWNER relay'
        pg_restore --host=postgres --username=relay --dbname=relay \
          --no-owner --no-privileges --exit-on-error "$$from/database.dump"
        mkdir -p /relay/files
        find /relay/files -mindepth 1 -delete
        cp -R "$$from/files/." /relay/files/
        chown -R 1000:1000 /relay/files
        echo "restored backups/$$name; start Relay again with: docker compose up -d"
      - restore

volumes:
  caddy-data:
  caddy-config:
  relay-files:
  postgres-data:
  valkey-data:
