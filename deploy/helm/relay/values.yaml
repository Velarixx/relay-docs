# Relay needs Postgres, Valkey and (with more than one replica) S3-compatible storage.
# Bring your own; this chart runs Relay itself.

image:
  repository: ghcr.io/velarixx/relay
  tag: ''
  pullPolicy: IfNotPresent

replicaCount: 2

# The address people use, e.g. https://chat.example.com
publicUrl: https://chat.example.com

# Secrets: either give values here (the chart creates a Secret) or name an existing Secret
# with the keys SECRET_KEY, DATABASE_URL, VALKEY_URL and optionally SMTP_URL, S3_ACCESS_KEY,
# S3_SECRET_KEY, METRICS_TOKEN, LIVEKIT_API_KEY, LIVEKIT_API_SECRET.
existingSecret: ''
secrets:
  SECRET_KEY: ''
  DATABASE_URL: ''
  VALKEY_URL: ''
  SMTP_URL: ''
  S3_ACCESS_KEY: ''
  S3_SECRET_KEY: ''
  METRICS_TOKEN: ''
  LIVEKIT_API_KEY: ''
  LIVEKIT_API_SECRET: ''

# Plain settings passed as environment variables.
env:
  LOG_LEVEL: info
  MAIL_FROM: ''
  STORAGE_DRIVER: s3
  S3_ENDPOINT: ''
  S3_BUCKET: relay
  S3_REGION: us-east-1
  LIVEKIT_URL: ''
  # Where subscriptions check in; empty uses the address built into the image.
  LICENSE_SERVER_URL: ''
  # The vendor's push gateway, for notifications in the mobile apps while they are closed.
  PUSH_GATEWAY_URL: ''

# Only for STORAGE_DRIVER=local with a single replica.
persistence:
  enabled: false
  size: 10Gi
  storageClass: ''

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ''
  annotations: {}
  host: chat.example.com
  tls:
    enabled: true
    secretName: relay-tls

resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    memory: 1Gi

podDisruptionBudget:
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
