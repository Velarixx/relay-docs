{{- if not .Values.existingSecret }}
{{- if not .Values.secrets.SECRET_KEY }}{{ fail "secrets.SECRET_KEY is required (or set existingSecret)" }}{{ end }}
{{- if not .Values.secrets.DATABASE_URL }}{{ fail "secrets.DATABASE_URL is required (or set existingSecret)" }}{{ end }}
{{- if not .Values.secrets.VALKEY_URL }}{{ fail "secrets.VALKEY_URL is required (or set existingSecret)" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "relay.fullname" . }}
  labels:
    {{- include "relay.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
